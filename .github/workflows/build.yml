name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/TvaiStudio/TvaiStudio.csproj

      # 共享内核来源清单必须与实际文件一致（防止有人就地改内核而不更新 MANIFEST）。
      - name: Verify shared-core manifest integrity
        shell: pwsh
        run: |
          $manifest = Get-Content third_party/videoenhancer-core/MANIFEST.json -Raw | ConvertFrom-Json
          $bad = 0
          foreach ($entry in $manifest.files) {
            $path = Join-Path 'third_party/videoenhancer-core' $entry.file
            if (-not (Test-Path -LiteralPath $path)) { Write-Host "缺失: $($entry.file)"; $bad++; continue }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.sha256) { Write-Host "哈希不符: $($entry.file)"; $bad++ }
          }
          if ($bad -gt 0) { throw "共享内核与 MANIFEST 不一致（$bad 项）。" }
          Write-Host "共享内核 $($manifest.files.Count) 个文件与 MANIFEST 一致。"

      # 与上游逐文件比对需要检出上游仓库，故仅在提供了该检出时运行。
      - name: Sync against source repo (optional)
        if: ${{ env.TVAISTUDIO_CORE_SOURCE != '' }}
        shell: pwsh
        run: pwsh -File tools/sync-tvai-core.ps1 -Verify

      - name: Build (warnings as errors)
        run: dotnet build src/TvaiStudio/TvaiStudio.csproj -c Release -warnaserror

      - name: Publish
        run: dotnet publish src/TvaiStudio/TvaiStudio.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvaistudio-win-x64
          path: src/TvaiStudio/bin/Release/net10.0-windows/win-x64/publish/tvaistudio.exe
          if-no-files-found: error
